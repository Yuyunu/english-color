    background-color: #0f111a;

    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    min-height: 100vh;

  .bg-game-glow {
    background:

      radial-gradient(circle at 85% 75%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),

    min-height: 100vh;
  }
  .display-font { font-family: var(--font-game); letter-spacing: 0.5px; }
  .title-gradient {
    background: linear-gradient(120deg, #fbbf24, #ec4899 45%, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* 3D 按鈕基礎 */
  .btn-3d {
    position: relative;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    border-radius: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: var(--font-game);
  }
  .btn-3d:active { transform: translateY(4px); }

    60% { transform: scale(1.05) translateY(-5px); opacity: 1; }

// ============ 顏色 — 開新關卡時隨機生成 6 色配色 ============
const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const hex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${hex(f(0))}${hex(f(8))}${hex(f(4))}`;
}
function darkenHex(hex, factor = 0.65) {
  const r = Math.round(parseInt(hex.slice(1,3),16) * factor);
  const g = Math.round(parseInt(hex.slice(3,5),16) * factor);
  const b = Math.round(parseInt(hex.slice(5,7),16) * factor);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}
function textColorFor(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1f2937' : '#ffffff';
}
function generateRandomPalette() {
  // 從色相環隨機挑一個起點,6 色平均分佈,飽和度與亮度加點隨機讓每張色彩感不同
  const baseHue = Math.random() * 360;
  const spread = 55 + Math.random() * 15; // 每格轉 55-70 度
  const sat = 55 + Math.random() * 30;    // 55-85
  const lit = 50 + Math.random() * 15;    // 50-65
  const cols = [];
  for (let i = 0; i < 6; i++) {
    const h = (baseHue + i * spread + (Math.random() * 20 - 10)) % 360;
    const s = sat + (Math.random() * 20 - 10);
    const l = lit + (Math.random() * 15 - 7);
    cols.push(hslToHex(h, Math.max(30, Math.min(95, s)), Math.max(35, Math.min(75, l))));
  }
  // 洗牌避免固定順序
  for (let i = cols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  return cols;
}

function guessCategory(q) {
  const optsAll = q.opts.join(',');
  // color
  if (/紅色|黃色|藍色|綠色|紫色|橘色|黑色|白色/.test(optsAll)) return 'color';
  // adj (of 的)
  const adjCount = q.opts.filter(o => o.endsWith('的')).length;
  if (adjCount >= 3) return 'adj';
  // seafood/sea life
  if (/海豚|鯨魚|鯊魚|章魚|水母|海龜|海星|海豹|海獅|海鷗|企鵝/.test(optsAll)) return 'sea';
  // fruits
  if (/蘋果|香蕉|葡萄|橘子|檸檬|芒果|草莓|桃子|梨子|鳳梨|木瓜|西瓜|櫻桃/.test(optsAll)) return 'fruit';
  // veg
  if (/番茄|洋蔥|馬鈴薯|南瓜|茄子|青椒|紅蘿蔔|玉米|菠菜|高麗菜|花椰菜|萵苣|地瓜|芋頭|絲瓜|苦瓜|冬瓜|小黃瓜/.test(optsAll)) return 'veg';
  // land animals
  if (/獅子|老虎|大象|長頸鹿|斑馬|猴子|狐狸|松鼠|兔子|熊|狼|狗|貓|老鼠|刺蝟/.test(optsAll)) return 'animal';
  // birds
  if (/母雞|小雞|鴨子|火雞|鵝|鴿子|孔雀|老鷹|海鷗|鴕鳥/.test(optsAll)) return 'bird';
  // vehicle
  if (/汽車|火車|飛機|腳踏車|機車|貨車|捷運/.test(optsAll)) return 'vehicle';
  // drink
  if (/牛奶|果汁|汽水|咖啡|紅茶|啤酒|紅酒|葡萄酒/.test(optsAll)) return 'drink';
  // desserts
  if (/蛋糕|餅乾|布丁|冰淇淋|奶酪|鬆餅|三明治|吐司|漢堡|披薩|壽司/.test(optsAll)) return 'food';
  // weather
  if (/晴朗的|下雨的|多雲的|刮風的|下雪的|起霧的|多雲|晴天/.test(optsAll)) return 'weather';
  // emotion / verb
  if (/^(哭|笑|唱|說|聽|喊|叫|等|跑|跳|走)/.test(q.opts[0])) return 'verb';
  // time
  if (/清晨|早上|中午|下午|傍晚|夜晚|午夜|正午|深夜/.test(optsAll)) return 'time';
  // royalty / fantasy
  if (/國王|皇后|公主|王子|大臣|侍女|巫師|女巫|騎士|士兵/.test(optsAll)) return 'royalty';
  // flowers
  if (/玫瑰|百合|向日葵|康乃馨|鬱金香|雛菊|梅花|蘭花/.test(optsAll)) return 'flower';
  return 'default';
}

function synonymOf(word) {
  for (const g of SYNONYM_GROUPS) if (g.includes(word)) return g;
  return [word];
}
// 子字串保護:如果一個詞完全包含在另一個詞裡(如「月」⊂「二月」),當作近似
function subsumes(a, b) {
  if (a === b) return true;
  if (a.length >= 1 && b.length > a.length && b.includes(a)) return true;
  if (b.length >= 1 && a.length > b.length && a.includes(b)) return true;
  return false;
}

function pickFillers(q, n = 2) {
  const cat = guessCategory(q);
  let pool = FILLER_POOLS[cat] || FLOWER_FILLER;
  if (cat === 'flower') pool = FLOWER_FILLER;
  if (cat === 'default') pool = DEFAULT_FILLER;
  // 排除已存在字詞 + 同義群 + 字面包含關係
  const blocked = new Set();
  for (const opt of q.opts) {
    synonymOf(opt).forEach(x => blocked.add(x));
    blocked.add(opt);
  }
  pool = pool.filter(x => {
    if (blocked.has(x)) return false;
    for (const opt of q.opts) if (subsumes(x, opt)) return false;
    return true;
  });
  // deterministic pick based on q.w
  let seed = 0;
  for (const ch of q.w) seed = (seed * 33 + ch.charCodeAt(0)) & 0xffff;
  const chosen = [];
  for (let i = 0; i < n; i++) {
    const idx = (seed + i * 7 + 3) % Math.max(1, pool.length);
    let pick = pool[idx];
    let tries = 0;
    while (pool.length && tries < pool.length && (
      chosen.includes(pick) ||
      chosen.some(c => synonymOf(c).includes(pick) || subsumes(c, pick))
    )) {
      pick = pool[(idx + ++tries) % pool.length];
    }
    chosen.push(pick || '其他');
  }
  return chosen;
}

function puzzleWidth(pzi) { return PUZZLES[pzi].grid[0].length; }
function puzzleHeight(pzi) { return PUZZLES[pzi].grid.length; }

// 每關固定 25 題:多個格子共用一題,答一次全部同題號的格子一起著色
const QUESTIONS_PER_PUZZLE = 50;

// 決定性 PRNG (Mulberry32) — 讓每關的題目固定
function mulberry32(seed) {
  return function() {
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 一次算出全 40 關的題目分配,遵守「每個單字全域最多用 2 次」
let _PUZZLE_QUESTION_PLAN = null;
function buildAllPuzzlePlans() {
  const plans = new Array(PUZZLES.length);
  const useCounts = new Map();  // qi -> global count
  for (let pzi = 0; pzi < PUZZLES.length; pzi++) {
    const rand = mulberry32((pzi + 1) * 2654435761 >>> 0);
    const flat = PUZZLES[pzi].grid.join('').split('');
    const cellsByColor = {};
    flat.forEach((L, i) => { if (L !== 'X') (cellsByColor[L] = cellsByColor[L] || []).push(i); });
    const colorLetters = Object.keys(cellsByColor).sort();
    const totalCells = colorLetters.reduce((s, L) => s + cellsByColor[L].length, 0);

    const qPerColor = {};
    let totalQ = 0;
    for (const L of colorLetters) {
      qPerColor[L] = Math.max(1, Math.round(cellsByColor[L].length / totalCells * QUESTIONS_PER_PUZZLE));
      totalQ += qPerColor[L];
    }
    while (totalQ > QUESTIONS_PER_PUZZLE) {
      let maxL = colorLetters[0];
      for (const L of colorLetters) if (qPerColor[L] > qPerColor[maxL]) maxL = L;
      if (qPerColor[maxL] <= 1) break;
      qPerColor[maxL]--; totalQ--;
    }
    while (totalQ < QUESTIONS_PER_PUZZLE) {
      let maxRatioL = colorLetters[0];
      for (const L of colorLetters) {
        const cur = cellsByColor[L].length / qPerColor[L];
        const best = cellsByColor[maxRatioL].length / qPerColor[maxRatioL];
        if (cur > best) maxRatioL = L;
      }
      qPerColor[maxRatioL]++; totalQ++;
    }

    const seededShuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    };

    // 從全題庫抽出這關要用的所有題目 (不再按 q.ans 分池,顏色由格子的 grid letter 決定)
    const result = new Array(flat.length).fill(null);
    const usedInThisPuzzle = new Set();
    // 全題庫按 global 使用次數分桶
    const allPool = QUESTIONS.map((_, idx) => idx);
    const buckets = {};
    allPool.forEach(q => {
      const c = useCounts.get(q) || 0;
      (buckets[c] = buckets[c] || []).push(q);
    });
    const bucketKeys = Object.keys(buckets).map(Number).sort((a, b) => a - b);
    const ordered = [];
    for (const k of bucketKeys) {
      const b = buckets[k].slice();
      seededShuffle(b);
      ordered.push(...b);
    }
    // 依顏色依序抽題,保證同關不重複
    let cursor = 0;
    for (const L of colorLetters) {
      const need = qPerColor[L];
      const pick = [];
      while (pick.length < need && cursor < ordered.length) {
        const q = ordered[cursor++];
        if (usedInThisPuzzle.has(q)) continue;
        pick.push(q);
        usedInThisPuzzle.add(q);
      }
      pick.forEach(q => useCounts.set(q, (useCounts.get(q) || 0) + 1));

      const cells = cellsByColor[L].slice();
      seededShuffle(cells);
      cells.forEach((cellIdx, k) => {
        result[cellIdx] = pick[k % pick.length];
      });
    }
    plans[pzi] = result;
  }
  return plans;
}

function pickQuestionsForPuzzle(pzi) {
  if (!_PUZZLE_QUESTION_PLAN) _PUZZLE_QUESTION_PLAN = buildAllPuzzlePlans();
  return _PUZZLE_QUESTION_PLAN[pzi].slice();
}

  // 背景/場景
  bg:{h:200,s:22,l:88}, background:{h:200,s:22,l:88}, kitchen:{h:35,s:22,l:90},
  summer:{h:200,s:30,l:85}, winter:{h:205,s:35,l:88}, night:{h:235,s:50,l:22},
  cloud:{h:210,s:15,l:92}, ground:{h:30,s:20,l:70},
};

function colorFromRole(role) {
  if (!role) return {h: Math.random()*360, s: 60, l: 55};
  const r = role.toLowerCase();
  const tokens = r.split(/[-_ ]/);
  let base = null;
  for (const t of tokens) {
    if (COLOR_BASES[t]) { base = { ...COLOR_BASES[t] }; break; }
  }
  if (!base) base = {h: Math.random()*360, s: 55, l: 55};
  // tone
  const isLight = /light|highlight/.test(r);
  const isDark = /dark|shadow/.test(r);
  const isMid = /-mid$|_mid$| mid$| mid /.test(r);
  if (isLight) base.l = Math.min(95, base.l + 15);
  else if (isDark) base.l = Math.max(15, base.l - 18);
  return base;
}
function hueDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}
function pickDistinctHue(usedHues, minDist = 40) {
  for (let t = 0; t < 25; t++) {
    const h = Math.random() * 360;
    if (usedHues.every(u => hueDist(h, u) >= minDist)) return h;
  }
  return Math.random() * 360;
}

function pickPalette(pzi) {
  const puzzle = PUZZLES[pzi];
  const usedLetters = new Set();
  puzzle.grid.join('').split('').forEach(c => { if (c !== 'X') usedLetters.add(c); });
  const others = LETTERS.filter(L => !usedLetters.has(L));
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  // 保證涵蓋所有用到的字母,額外補到 8 個做干擾色來源
  const minPaletteSize = Math.max(8, usedLetters.size + 3);
  const includeSet = new Set([...Array.from(usedLetters), ...others.slice(0, Math.max(0, minPaletteSize - usedLetters.size))]);
  const letters = LETTERS.filter(L => includeSet.has(L));
  const roles = puzzle.colorRoles || {};
  const usedHues = [];
  const map = {};

  // 這關實際用到的顏色:照 role 名稱給固定色相
  for (const L of letters) {
    if (usedLetters.has(L)) {
      const role = roles[L];
      const {h, s, l} = colorFromRole(role);
      const hex = hslToHex(h, s, l);
      map[L] = { hex, text: textColorFor(hex) };
      usedHues.push(h);
    }
  }
  // 補充選項用的顏色:隨機挑距離其他色相夠遠的獨立色
  for (const L of letters) {
    if (!usedLetters.has(L)) {
      const h = pickDistinctHue(usedHues, 30);
      usedHues.push(h);
      const hex = hslToHex(h, 55 + Math.random() * 25, 50 + Math.random() * 10);
      map[L] = { hex, text: textColorFor(hex) };
    }
  }
  return { letters, map };
}

function computeCellLayout(qi, palette, targetL) {
  // 每題只顯示 5 顆按鈕:正解 (指定放在 targetL 色)+ 4 個從本關 palette 隨機挑的干擾色
  const q = QUESTIONS[qi];
  const ansIdx = LETTERS.indexOf(q.ans);
  const correct = q.opts[ansIdx];
  const others = palette.filter(L => L !== targetL);
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  const distractorLetters = others.slice(0, 4);
  const distractorOpts = q.opts.filter((_, i) => i !== ansIdx);
  for (let i = distractorOpts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [distractorOpts[i], distractorOpts[j]] = [distractorOpts[j], distractorOpts[i]];
  }
  const opts = {};
  opts[targetL] = correct;
  distractorLetters.forEach((L, k) => { opts[L] = distractorOpts[k] || '(?)'; });
  // 隨機排 5 顆按鈕位置
  const letters = [targetL, ...distractorLetters];
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  return { letters, opts };
}

function startPuzzle(idx) {
  state.page = 'play';
  state.puzzleIdx = idx;
  const p = pickPalette(idx);
  state.palette = p.letters;
  state.paletteMap = p.map;
  state.cellAnswers = pickQuestionsForPuzzle(idx);
  // 每個 cell 的 target color = grid letter
  const gridFlat = PUZZLES[idx].grid.join('').split('');
  state.cellTargets = gridFlat.map(L => L === 'X' ? null : L);
  // 同一題的所有格子共用同一組選項排列 + 同一個本地題號 (1-50)
  const uniqueQis = Array.from(new Set(state.cellAnswers.filter(x => x !== null)));
  const layoutByQi = {};
  const qiToLocalNum = {};
  uniqueQis.forEach((qi, i) => {
    // 找到這題對應的 target letter (第一個用它的 cell)
    const cellIdx = state.cellAnswers.indexOf(qi);
    const targetL = state.cellTargets[cellIdx];
    layoutByQi[qi] = computeCellLayout(qi, state.palette, targetL);
    qiToLocalNum[qi] = i + 1;
  });
  state.qiToLocalNum = qiToLocalNum;
  state.cellLayouts = state.cellAnswers.map(qi => qi === null ? null : layoutByQi[qi]);
  state.cellChosen = state.cellAnswers.map(() => null);
  state.currentCell = null;
  state.checked = false;
  state.showReward = false;
  render();
}

function backToMenu() {
  if (state.cellChosen.some(x => x !== null) && !confirm('離開這關進度不會存,確定嗎?')) return;
  state.page = 'menu';
  render();
}

function openCell(i) {
  if (state.cellAnswers[i] === null) return; // 空白格不能點
  state.currentCell = i;
  render();
}
function answerCell(letter) {
  const currentQi = state.cellAnswers[state.currentCell];
  // 同一題號的所有格子一起染色
  for (let i = 0; i < state.cellAnswers.length; i++) {
    if (state.cellAnswers[i] === currentQi) {
      state.cellChosen[i] = letter;
    }
  }
  state.currentCell = null;
  render();
}
function closeModal() { state.currentCell = null; render(); }

function checkAnswers() {
  state.checked = true;
  const wrong = wrongCount();
  if (wrong === 0) state.showReward = true;
  render();
  if (wrong > 0) {
    setTimeout(() => alert(`檢查完成 · 錯 ${wrong} 題(標紅色 ✕)。點格子可以再改答案。`), 300);
  }
}
function closeReward() { state.showReward = false; render(); }

function resetChecked() { state.checked = false; render(); }

function revealAnswers() {
  // 開發/測試用:一鍵填上所有正解,直接看拼出的圖案
  for (let i = 0; i < state.cellAnswers.length; i++) {
    const qi = state.cellAnswers[i];
    if (qi === null) continue;
    state.cellChosen[i] = state.cellTargets[i];
  }
  state.checked = false;
  render();
}

function wrongCount() {
  // 以「題目」為單位算錯幾題(而不是每格)
  const wrongQis = new Set();
  for (let i = 0; i < state.cellAnswers.length; i++) {
    const qi = state.cellAnswers[i];
    if (qi === null) continue;
    if (state.cellChosen[i] && state.cellChosen[i] !== state.cellTargets[i]) wrongQis.add(qi);
  }
  return wrongQis.size;
}

function allFilled() {
  for (let i = 0; i < state.cellAnswers.length; i++) {
    if (state.cellAnswers[i] === null) continue;
    if (state.cellChosen[i] === null) return false;
  }
  return true;
}

function activeCount() {
  // 唯一題數(該關的題數,通常是 25)
  return new Set(state.cellAnswers.filter(x => x !== null)).size;
}
function answeredCount() {
  const answeredQis = new Set();
  for (let i = 0; i < state.cellAnswers.length; i++) {
    const qi = state.cellAnswers[i];
    if (qi !== null && state.cellChosen[i]) answeredQis.add(qi);
  }
  return answeredQis.size;
}

// ============ 渲染 ============
function render() {
  document.getElementById('app').innerHTML = state.page === 'menu' ? renderMenu() : renderPlay();
}

function usedColorsInPuzzle(pzi) {
  const set = new Set(PUZZLES[pzi].grid.join('').split(''));
  set.delete('X');
  return Array.from(set).sort();
}

function renderMenu() {
  return `

      <p class="text-lg md:text-xl font-semibold text-slate-300">選對單字 · 召喚出可愛圖案 ✨</p>

    </header>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5 max-w-4xl mx-auto">
      ${PUZZLES.map((p, i) => {

        return `

                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="text-amber-400">
                  <path d="M5 4h4v4H5zM15 4h4v4h-4zM5 14h4v4H5zM15 14h4v4h-4zM10 9h4v4h-4z" fill="currentColor"/>
                </svg>
              </div>
              <div class="text-left">
                <div class="text-xs font-extrabold tracking-wider text-purple-400 uppercase">Stage ${String(i+1).padStart(2,'0')}</div>
                <div class="text-lg font-extrabold tracking-tight text-white group-hover:text-amber-300 transition-colors">?????</div>
              </div>
            </div>
            <div class="px-3 py-1.5 bg-[#121624] border border-[#2b3553] rounded-xl text-xs font-bold tracking-wider text-emerald-400 shadow-inner flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              ${w}×${h}

        `;

      解謎完成才會揭曉每關的圖案 🔮
    </footer>
  `;
}

function renderPlay() {
  const pz = PUZZLES[state.puzzleIdx];
  const w = puzzleWidth(state.puzzleIdx);
  const h = puzzleHeight(state.puzzleIdx);
  const gridFlat = pz.grid.join('').split('');
  const total = activeCount();
  const answered = answeredCount();
  const canCheck = allFilled();

  // 格子填滿 grid 欄位,自動 responsive
  const cellFontSize = Math.max(w, h) >= 13 ? '10px' : Math.max(w, h) >= 10 ? '12px' : '14px';

  const cellsHTML = gridFlat.map((letter, i) => {
    if (letter === 'X') {
      return `<div class="cell empty rounded" style="aspect-ratio:1"></div>`;
    }
    const qi = state.cellAnswers[i];
    const chosen = state.cellChosen[i];
    const correct = chosen && chosen === state.cellTargets[i];
    const localNum = String(state.qiToLocalNum[qi] || '?');
    let bg = '#ffffff';
    let inner = `<span style="color:#334155">${localNum}</span>`;
    let numColor = '#334155';

    if (chosen) {
      bg = state.paletteMap[chosen] ? state.paletteMap[chosen].hex : '#f3f4f6';
      // 染色後,題號用低不透明度的白/黑(依底色深淺自動反色),方便訂正
      const isLightBg = state.paletteMap[chosen] && state.paletteMap[chosen].text === '#1f2937';
      numColor = isLightBg ? 'rgba(0,0,0,0.28)' : 'rgba(255,255,255,0.35)';
      inner = `<span style="color:${numColor}">${localNum}</span>`;
      if (state.checked && !correct) {
        inner = `<span class="x-mark">✕</span>`;
      }
    }
    const isLight = chosen && state.paletteMap[chosen] && state.paletteMap[chosen].text === '#1f2937';
    const border = chosen ? (isLight ? 'border border-gray-300' : '') : 'border border-gray-300';
    const cls = chosen ? 'filled' : '';
    return `<div class="cell ${cls} rounded flex items-center justify-center font-bold cursor-pointer ${border}"
                 style="background:${bg};aspect-ratio:1;font-size:${cellFontSize};line-height:1"
                 onclick="openCell(${i})">${inner}</div>`;
  }).join('');

  let modalHTML = '';
  if (state.currentCell !== null) {
    const qi = state.cellAnswers[state.currentCell];
    const q = QUESTIONS[qi];
    modalHTML = `
      <div class="fixed inset-0 flex items-center justify-center z-50 p-4 modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-panel modal-box-3d w-full max-w-sm p-6 flex flex-col items-center text-center">
          <div class="w-full flex items-center justify-between mb-3">
            <div class="px-3.5 py-1 rounded-full bg-[#262f4c] text-slate-300 text-xs font-extrabold tracking-widest uppercase">
              QUESTION ${state.qiToLocalNum[qi] || '?'} / ${activeCount()}
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl w-8 h-8 rounded-full flex items-center justify-center">✕</button>
          </div>
          <div class="w-full py-4 px-3 bg-[#111523] border border-[#2c3655] rounded-2xl mb-6 shadow-inner">
            <div class="text-xs font-bold text-slate-400 mb-1">選出這個單字的中文意思</div>
            <div class="display-font text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-purple-300 tracking-wide">
              ${q.w}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3.5 w-full">
            ${(state.cellLayouts[state.currentCell].letters).map(L => {
              const c = state.paletteMap[L];
              const opt = state.cellLayouts[state.currentCell].opts[L];
              const dark = darkenHex(c.hex, 0.65);
              const alpha = c.hex + '59';
              return `<button onclick="answerCell('${L}')" class="btn-3d opt-btn py-3 px-2 text-base flex items-center justify-center"
                style="background:${c.hex};color:${c.text};box-shadow:0 5px 0 0 ${dark}, 0 10px 18px ${alpha}">
                ${opt}
              </button>`;
            }).join('')}
          </div>
          <div class="text-xs text-slate-400 mt-5">選哪個顏色 · 格子變那色 · 可以再改</div>
        </div>
      </div>
    `;
  }

  let bottomBar = '';
  if (state.checked) {
    const wc = wrongCount();
    bottomBar = `
      <div class="w-full max-w-2xl mx-auto mt-5 game-panel flex items-center justify-between" style="padding:16px 20px">
        <div class="display-font text-lg font-bold" style="color:${wc === 0 ? '#22c55e' : '#ef4444'}">
          ${wc === 0 ? '🎉 全對!' : `答錯 ${wc} 題(標 ✕)`}
        </div>
        <button onclick="resetChecked()" class="btn-3d btn-purple px-5 py-3 text-sm">繼續修改</button>
      </div>
    `;
  } else if (canCheck) {
    bottomBar = `
      <div class="w-full max-w-sm mx-auto mt-6 px-4">
        <button onclick="checkAnswers()" class="btn-3d btn-green w-full py-4 text-xl tracking-wider flex items-center justify-center gap-2">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          CHECK ANSWER
        </button>
      </div>
    `;
  }

  // 全對彩蛋 — 全螢幕勝利畫面
  let rewardHTML = '';
  if (state.showReward) {
    rewardHTML = `
      <div class="fixed inset-0 bg-[#0a0d18]/95 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeReward()">
        <div class="relative w-full max-w-sm flex flex-col items-center text-center" onclick="event.stopPropagation()">
          <div class="absolute -top-6 w-3 h-3 rounded-full bg-amber-400 particle" style="--tw-x: -70px; --tw-y: -90px;"></div>
          <div class="absolute -top-6 w-3 h-3 rounded-full bg-emerald-400 particle" style="--tw-x: 80px; --tw-y: -100px;"></div>
          <div class="absolute -top-6 w-2.5 h-2.5 rounded-sm bg-pink-500 particle" style="--tw-x: -110px; --tw-y: -40px;"></div>
          <div class="absolute -top-6 w-3.5 h-2 rounded-sm bg-cyan-400 particle" style="--tw-x: 100px; --tw-y: -50px;"></div>
          <div class="absolute -top-6 w-3 h-3 rounded-full bg-purple-400 particle" style="--tw-x: -50px; --tw-y: -140px;"></div>
          <div class="absolute -top-6 w-2.5 h-2.5 rounded-sm bg-yellow-300 particle" style="--tw-x: 60px; --tw-y: -160px;"></div>

              <div class="text-slate-400 text-xs font-bold uppercase">Level</div>
              <div class="display-font text-2xl font-black text-emerald-400">${String(state.puzzleIdx+1).padStart(2,'0')}</div>
            </div>
            <div>
              <div class="text-slate-400 text-xs font-bold uppercase">Accuracy</div>
              <div class="display-font text-2xl font-black text-amber-400">100%</div>
            </div>
          </div>

          <button onclick="closeReward()" class="btn-3d btn-green w-full py-4 text-xl tracking-wider">CONTINUE</button>
        </div>
      </div>
    `;
  }

  return `
    <header class="flex items-center justify-between gap-2 py-3 md:py-6 max-w-4xl mx-auto px-2 md:px-0">
      <button onclick="backToMenu()" class="btn-3d btn-purple px-3 py-2 text-xs md:text-sm whitespace-nowrap">← 選單</button>
      <h1 class="display-font text-lg md:text-3xl font-black text-white">
        LEVEL ${String(state.puzzleIdx + 1).padStart(2,'0')}
      </h1>
      <div class="px-3 py-2 bg-[#1b2032] border-2 border-[#2e3856] rounded-xl text-emerald-400 font-extrabold text-xs md:text-sm whitespace-nowrap">
        ${answered}/${total}
      </div>
    </header>

    <div class="flex flex-col md:flex-row gap-4 md:gap-5 items-stretch md:items-start justify-center max-w-4xl mx-auto px-2 md:px-0">
      <div class="game-panel flex-1 w-full min-w-0" style="padding:10px">
        <div class="grid gap-[2px] w-full" style="grid-template-columns: repeat(${w}, minmax(0, 1fr));">${cellsHTML}</div>
      </div>
      <aside class="game-panel w-full md:w-56 flex-shrink-0" style="padding:16px">
        <div class="text-xs font-extrabold uppercase tracking-widest mb-3 text-slate-400">HOW TO PLAY</div>
        <div class="text-sm leading-relaxed text-slate-300 space-y-1.5">
          <p>🎯 點格子跳出題目</p>
          <p>🎨 選選項後格子變顏色</p>
          <p>↻ 隨時再點格子改答案</p>
          <p>✓ 全部填完後檢查答案</p>
        </div>
        ${new URLSearchParams(location.search).has('debug') ? `
        <hr class="my-3 border-slate-700">
        <button onclick="revealAnswers()" class="text-xs w-full py-2 px-3 rounded-lg text-purple-300 hover:text-purple-200 transition"
                style="background:rgba(168,85,247,0.1);border:1px dashed rgba(168,85,247,0.35)">
          🔧 顯示答案(測試)
        </button>` : ''}
      </aside>
    </div>

    ${bottomBar}
    ${modalHTML}
    ${rewardHTML}
  `;
}

render();
</script>
